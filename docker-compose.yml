services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-scl}
      - POSTGRES_USER=${POSTGRES_USER:-scl}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py sync_roles && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: ${SCL_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
