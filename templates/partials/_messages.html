{% if messages and not suppress_app_messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert" data-app-message data-ui-message-title="{% if message.tags == 'success' %}Sucesso{% elif message.tags == 'error' %}Erro{% else %}Aviso{% endif %}">{{ message }}</div>
    {% endfor %}
{% endif %}
