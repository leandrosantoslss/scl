{% extends "base_app.html" %}

{% block title %}SCL - Integração{% endblock %}
{% block page_title %}Nova integração{% endblock %}

{% block content %}
<form method="post" class="row g-3" style="max-width: 480px">
    {% csrf_token %}
    {% for field in form %}
        <div class="col-12">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
    {% endfor %}
    <div class="col-12">
        <a class="btn btn-secondary btn-sm" href="{% url 'integracoes:list' %}">Cancelar</a>
        <button class="btn btn-primary btn-sm" type="submit">Salvar</button>
    </div>
</form>
{% endblock %}
